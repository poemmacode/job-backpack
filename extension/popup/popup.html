<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Backpack</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>🎒 Job Backpack</h1>
    </header>

    <main>
      <div id="loading" class="hidden">
        <p>Loading...</p>
      </div>

      <div id="no-api-key" class="hidden">
        <p class="warning">No API key configured</p>
        <p class="text-sm">Go to Settings to add your API key.</p>
      </div>

      <div id="no-job" class="hidden">
        <p class="warning">No job detected on this page</p>
      </div>

      <div id="job-form" class="hidden">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" required>
        </div>
        <div class="form-group">
          <label for="company">Company</label>
          <input type="text" id="company" required>
        </div>
        <div class="form-group">
          <label for="location">Location</label>
          <input type="text" id="location">
        </div>
        <div class="form-group">
          <label for="salary">Salary</label>
          <input type="text" id="salary">
        </div>
        <div class="form-group">
          <label for="url">URL</label>
          <input type="text" id="url" readonly>
        </div>
        <div class="form-group">
          <label for="notes">Notes</label>
          <textarea id="notes" rows="2"></textarea>
        </div>

        <button id="save-btn" class="btn-primary">Save to Job Backpack</button>
      </div>

      <div id="success" class="hidden">
        <p class="success">✓ Job saved successfully!</p>
      </div>

      <div id="already-saved" class="hidden">
        <p class="warning">This job is already saved</p>
        <button id="view-btn" class="btn-secondary">View in Job Backpack</button>
      </div>

      <div id="settings-view" class="hidden">
        <div class="form-group">
          <label for="api-key-input">API Key</label>
          <input type="text" id="api-key-input" placeholder="jb_..." class="api-key-input">
        </div>
        <p class="text-xs text-gray-500 mb-3">
          Find your API key at Job Backpack → Dashboard → Extension
        </p>
        <div class="flex gap-2">
          <button id="save-key-btn" class="btn-primary flex-1">Save Key</button>
          <button id="cancel-settings-btn" class="btn-secondary flex-1">Cancel</button>
        </div>
        <p id="key-saved" class="success hidden mt-2">✓ API key saved!</p>
      </div>
    </main>

    <footer>
      <button id="settings-btn" class="btn-icon" title="Settings">⚙️</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
